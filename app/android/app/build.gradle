plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

// The upload key is read from app/android/key.properties (git-ignored) when it
// exists; without it release builds stay debug-signed so CI validation builds work.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def useUploadKey = keystorePropertiesFile.exists()
if (useUploadKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        .findAll { !keystoreProperties[it] }
    if (missing) {
        throw new GradleException("key.properties is missing: ${missing.join(', ')}")
    }
}
println(useUploadKey
    ? 'Release signing: upload key from key.properties'
    : 'Release signing: debug signing (no key.properties)')

android {
    namespace 'com.linux.simplemathtester'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.linux.simplemathtester'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (useUploadKey) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig useUploadKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
