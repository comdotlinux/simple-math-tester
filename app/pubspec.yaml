name: simple_math_tester
description: A friendly arithmetic practice app for curious minds.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  duration: ^4.0.3
  provider: ^6.1.5+1
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Only integration_test_web/ uses it, to read the DOM in Chrome.
  web: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/correct.wav
    - assets/sounds/wrong.wav
    - assets/sounds/level_up.wav
    - assets/sounds/goal.wav
  # Bundled so the web build never fetches Roboto from fonts.gstatic.com; the
  # web engine downloads it whenever no family is named exactly "Roboto".
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        # Also serves w800: a Black (900) file would draw headings heavier than before.
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
