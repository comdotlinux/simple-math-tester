name: simple_math_tester
description: A friendly arithmetic practice app for curious minds.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # Pinned by flutter_localizations.
  provider: ^6.1.5+1
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  # Only for the report a grown-up sends (lib/report.dart, issue #150).
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Only integration_test_web/ uses it, to read the DOM in Chrome.
  web: ^1.1.2
  math_expressions: ^3.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/correct.wav
    - assets/sounds/wrong.wav
    - assets/sounds/level_up.wav
    - assets/sounds/goal.wav
    # Shown under Settings > Licences > Other attributions (see attributions
    # in lib/legal.dart).
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSansDevanagari_LICENSE.txt
    - assets/fonts/NotoSansTelugu_LICENSE.txt
    - assets/fonts/NotoSansTamil_LICENSE.txt
    - assets/fonts/NotoSansMalayalam_LICENSE.txt
    - assets/fonts/NotoSansGurmukhi_LICENSE.txt
    - assets/fonts/NotoSansBengali_LICENSE.txt
    - assets/fonts/NotoSansGujarati_LICENSE.txt
    - assets/fonts/NotoSansArabic_LICENSE.txt
    - assets/fonts/NotoNastaliqUrdu_LICENSE.txt
  # Bundled so the web build never fetches Roboto from fonts.gstatic.com; the
  # web engine downloads it whenever no family is named exactly "Roboto".
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        # Also serves w800: a Black (900) file would draw headings heavier than before.
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # Fallbacks for the Indian scripts (hi, mr: Devanagari; te; ta; ml; pa:
    # Gurmukhi; bn: Bengali; gu: Gujarati) and Arabic script (ar: Naskh; ur:
    # Nastaliq, put first for ur in app_theme.dart),
    # bundled for the same reason: the web engine would otherwise fetch Noto
    # fonts from fonts.gstatic.com. Unhinted, regular and bold only, to keep
    # the bundle small.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Regular.ttf
        - asset: assets/fonts/NotoSansGurmukhi-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
