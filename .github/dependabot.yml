# Weekly update PRs, one grouped PR per ecosystem, only for releases at least
# 7 days old (cooldown). Security updates ignore the cooldown and come at once.
# Dependabot PRs run the normal PR checks and get no Actions secrets.
# Gradle (app/android) is left out: Flutter sets the Android Gradle plugin and
# Kotlin versions; they move with `flutter upgrade`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tool
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
