name: Generate store screenshots (temporary)

on:
  push:
    branches: [screenshots-generate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Shoot
        run: |
          export SCREENSHOT_SIZE=450x800 SCREENSHOT_PIXEL_RATIO=2.4
          mkdir -p "$RUNNER_TEMP/raw"
          SCREENSHOT_DIR="$RUNNER_TEMP/raw" flutter test tool/screenshots_test.dart
          SCREENSHOT_DIR="$RUNNER_TEMP/raw" SCREENSHOT_LANGUAGES=de,pl,hi,mr,te,ta,ml,fr,ro flutter test tool/screenshots_test.dart
      - name: Convert
        run: |
          im=magick; command -v magick || im=convert
          out="$RUNNER_TEMP/out"
          for pair in en:en-US de:de-DE pl:pl-PL hi:hi-IN mr:mr-IN te:te-IN ta:ta-IN ml:ml-IN fr:fr-FR ro:ro; do
            code=${pair%%:*}; play=${pair#*:}
            p=$code-; [ "$code" = en ] && p=
            mkdir -p "$out/$play"
            for map in light-450x800-1-practice:phone-1-practice light-450x800-2b-celebration:phone-2-correct \
                light-450x800-3b-wrong-hints:phone-3-hints light-450x800-5-sprint:phone-4-sprint \
                light-450x800-7-answers:phone-5-my-answers dark-450x800-1-practice:phone-6-dark \
                light-450x800-11b-compact-answers:phone-7-compact; do
              $im "$RUNNER_TEMP/raw/$p${map%%:*}.png" -background white -alpha remove -alpha off "PNG24:$out/$play/${map#*:}.png"
            done
          done
          identify "$out"/*/*.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/out
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: raw-screenshots
          path: ${{ runner.temp }}/raw
