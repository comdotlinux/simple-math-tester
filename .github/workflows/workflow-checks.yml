name: Workflow checks

on:
  pull_request:
    branches: [main]
    paths: ['.github/**']
  push:
    branches: [main]
    paths: ['.github/**']
  # Weekly, so an action that becomes known-vulnerable is reported without a change here.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails the job on any finding; no SARIF upload, so no security-events: write.
      # The online audits (impostor commits, known-vulnerable actions) read public data
      # with the job's read-only token.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
