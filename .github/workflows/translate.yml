name: Translate new and changed strings

# Translates only what is missing or changed (per language: keys absent from
# its ARB file, or whose English text changed since it was translated) with
# DeepSeek and opens or updates one pull request. The Play store listing
# (play/listing/en-US.json) is translated the same way, into the same pull
# request. Runs on main only: by itself when the English texts or the language
# list change, or by hand. See docs/translations.md.
on:
  push:
    branches: [main]
    paths:
      - app/lib/l10n/app_en.arb
      - tool/translate.mjs
      - play/listing/en-US.json
      - tool/translate_listing.mjs
  workflow_dispatch:

# One run at a time; a newer push queues behind the running one.
concurrency:
  group: translate
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  translate:
    name: Translate and open a pull request
    # A manual run on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # DEEPSEEK_API_KEY is a `release` environment secret (v* tags and main only).
    environment: release
    permissions:
      contents: write
      pull-requests: write
      # Starts the Flutter checks on the pull request branch.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job's token can write; keep it out of .git/config so pub packages
          # and the tests never see it. Only the last step gets it, through GH_TOKEN.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: List missing and changed strings
        run: |
          node tool/translate.mjs --dry-run
          node tool/translate_listing.mjs --dry-run
      - name: Translate with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          FAILED_KEYS_FILE: ${{ runner.temp }}/failed-keys.txt
        run: |
          # Exit code 2: some strings failed every retry. The others are still
          # checked and go into the pull request; the last step fails the run.
          node tool/translate.mjs || [ $? -eq 2 ]
          node tool/translate_listing.mjs
      # A pull request opened with GITHUB_TOKEN starts no other workflow, so
      # the translations are checked here before it is opened.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check the translations
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/l10n_test.dart test/solution_steps_test.dart
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Status, not diff: a new language's ARB file is untracked.
          if [ -z "$(git status --porcelain -- app/lib/l10n play/listing)" ]; then
            echo "Every translation is up to date."
            exit 0
          fi
          # One branch, rebuilt from main each run, so open translations collect
          # in a single pull request.
          branch=translations/auto
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add app/lib/l10n play/listing
          git commit -m 'fix(l10n): translate new and changed strings'
          # The token goes in the URL of this one push; GitHub masks it in the log.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title 'fix(l10n): translate new and changed strings' \
              --body "Machine translations from DeepSeek of the strings and Play listing texts that were missing or whose English changed (latest run: $run_url). Placeholders, plurals, digits and Play's length limits were checked, and test/l10n_test.dart passed. After merging, push listing changes with the Play store listing workflow. The Flutter checks are started on this branch by the workflow."
          fi
          # A pull request pushed with GITHUB_TOKEN starts no workflow by itself;
          # a dispatch does.
          gh workflow run flutter-checks.yml --ref "$branch" -f environment-name=none
      - name: Fail on strings that were not translated
        env:
          FAILED_KEYS_FILE: ${{ runner.temp }}/failed-keys.txt
        run: |
          if [ -s "$FAILED_KEYS_FILE" ]; then
            echo "::error::Not translated after every retry (they keep their old text and are retried on the next run):"
            cat "$FAILED_KEYS_FILE"
            exit 1
          fi
