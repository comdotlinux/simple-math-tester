name: Lint workflows and shell scripts

on:
  pull_request:
    branches: [main]
    paths: ['.github/**', 'tool/**.sh']
  push:
    branches: [main]
    paths: ['.github/**', 'tool/**.sh']
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: '1.7.12'
  # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release's checksums file.
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  lint:
    name: actionlint and shellcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint runs shellcheck on every run: block, but silently skips it when
      # shellcheck is missing; this step makes a missing shellcheck fail the job.
      - name: Check shellcheck is installed
        run: shellcheck --version
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Lint shell scripts
        run: shellcheck -x .github/*.sh tool/*.sh
