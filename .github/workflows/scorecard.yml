name: OpenSSF Scorecard

# Publishes the score to api.scorecard.dev (public) and the findings to code scanning.
# The Scorecard API rejects results unless this workflow keeps its rules: no top-level
# env or defaults, no workflow-level write permissions, and only checkout,
# upload-artifact, upload-sarif, scorecard-action and harden-runner steps in the job.
on:
  # TEMPORARY trial run on this pull request; removed before merge.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # The Scorecard API accepts only GitHub's Ubuntu runners; ubuntu-latest is the
    # label its documentation shows.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published results (publish_results).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
