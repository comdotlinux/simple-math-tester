name: Play app bundle

# Separate from flutter-checks.yml: a manual run of that workflow needs an
# environment input and deploys the web build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  BUNDLETOOL_VERSION: '1.18.3'
  # sha256 published by GitHub for bundletool-all-1.18.3.jar.
  BUNDLETOOL_SHA256: 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'

jobs:
  bundle:
    name: Build signed app bundle and check 16 KB pages
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The keystore goes to $RUNNER_TEMP, never under an uploaded path. Without the
      # secrets (forks, or before the owner sets them) a throwaway key made here signs
      # the bundle, so the build and the not-debug check still run; nothing is uploaded.
      - name: Write key.properties
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          set_count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS"; do
            if [ -n "$value" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq 4 ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="$ANDROID_KEY_PASSWORD"
            alias="$ANDROID_KEY_ALIAS"
            signing=upload
          elif [ "$set_count" -eq 0 ]; then
            echo "::notice::Keystore secrets are not set: signing with a throwaway key, no artifact is uploaded"
            store_password="$(openssl rand -hex 24)"
            echo "::add-mask::$store_password"
            key_password="$store_password"
            alias=throwaway
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -storepass "$store_password" -keypass "$key_password" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway CI key" -noprompt
            signing=throwaway
          else
            echo "::error::Only $set_count of the 4 keystore secrets are set"
            exit 1
          fi
          # key.properties is a Java properties file: a backslash starts an escape.
          umask 077
          {
            echo "storeFile=${keystore//\\/\\\\}"
            echo "storePassword=${store_password//\\/\\\\}"
            echo "keyPassword=${key_password//\\/\\\\}"
            echo "keyAlias=${alias//\\/\\\\}"
          } > android/key.properties
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
      - name: Build app bundle
        run: |
          build_number=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          echo "Build number $build_number"
          flutter build appbundle --release --build-number="$build_number" | tee "$RUNNER_TEMP/build.log"
          grep -q 'Release signing: upload key from key.properties' "$RUNNER_TEMP/build.log"
      - name: Fail if the bundle carries the Android debug certificate
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/aab-cert.txt"
          if ! grep -q '^Owner:' "$RUNNER_TEMP/aab-cert.txt"; then
            echo "::error::The app bundle is not signed"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/aab-cert.txt"; then
            echo "::error::The app bundle is signed with the Android debug certificate"
            exit 1
          fi
      # Google Play requires 16 KB page support: every APK built from the bundle is
      # zip-aligned for 16 KB pages and every native library has 16 KB LOAD segments.
      - name: Check 16 KB page support of the APKs built from the bundle
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          zipalign="$(find "$sdk/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          readelf="$(find "$sdk/ndk" -path '*/prebuilt/linux-x86_64/bin/llvm-readelf' | sort -V | tail -n 1)"
          if [ -z "$zipalign" ] || [ -z "$readelf" ]; then
            echo "::error::zipalign ($zipalign) or llvm-readelf ($readelf) not found under $sdk"
            exit 1
          fi
          echo "Using $zipalign and $readelf"
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$bundletool" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $bundletool" | sha256sum -c -
          java -jar "$bundletool" build-apks --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/app.apks"
          apks="$RUNNER_TEMP/apks"
          mkdir -p "$apks"
          unzip -q "$RUNNER_TEMP/app.apks" -d "$apks"
          so_count=0
          while IFS= read -r apk; do
            if ! "$zipalign" -c -P 16 -v 4 "$apk" > "$RUNNER_TEMP/zipalign.log"; then
              tail -n 20 "$RUNNER_TEMP/zipalign.log"
              echo "::error::$apk is not aligned for 16 KB pages"
              exit 1
            fi
            echo "zipalign 16 KB OK: ${apk#"$apks"/}"
            libs="$apk.libs"
            mkdir -p "$libs"
            unzip -q -o "$apk" 'lib/*.so' -d "$libs" 2> /dev/null || true
            while IFS= read -r so; do
              so_count=$((so_count + 1))
              aligns="$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')"
              if [ -z "$aligns" ]; then
                echo "::error::No LOAD segment in ${so#"$apks"/}"
                exit 1
              fi
              for align in $aligns; do
                if (( align < 0x4000 )); then
                  echo "::error::${so#"$apks"/} has LOAD alignment $align, below 0x4000"
                  exit 1
                fi
              done
              echo "LOAD alignment OK ($(printf '%s' "$aligns" | tr '\n' ',')): ${so#"$apks"/}"
            done < <(find "$libs" -name '*.so' -type f | sort)
          done < <(find "$apks" -name '*.apk' -type f | sort)
          if [ "$so_count" -eq 0 ]; then
            echo "::error::No native libraries found in the APKs"
            exit 1
          fi
      - name: Upload signed app bundle
        if: steps.key.outputs.signing == 'upload'
        uses: actions/upload-artifact@v7
        with:
          name: simple-math-tester-play-bundle
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
