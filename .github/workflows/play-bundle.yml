name: Play app bundle

# Separate from flutter-checks.yml: a manual run of that workflow needs an
# environment input and deploys the web build.
# A push to main (or a manual run) builds and checks the bundle, then discards it.
# Pushing a version tag (git tag v1.2.3 && git push origin v1.2.3) builds it with
# that version, uploads it to the Play internal testing track and then creates
# the GitHub release. One workflow does it all: a release created with
# GITHUB_TOKEN would not start another workflow.
# Two jobs, so no secret meets code it does not need: `bundle` runs Gradle, pub and
# Flutter with only the signing key, and hands the signed bundle on as an artifact;
# `upload` gets the Play and DeepSeek keys and runs no build tooling. On a tag each
# job uses the `release` environment, so each waits for its own approval.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  BUNDLETOOL_VERSION: '1.18.3'
  # sha256 published by GitHub for bundletool-all-1.18.3.jar.
  BUNDLETOOL_SHA256: 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'

jobs:
  bundle:
    name: Build signed app bundle and check 16 KB pages
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Tag runs use the `release` environment (only v* tags and main may deploy to
    # it), so its secrets never reach other branches. This job reads only the
    # signing key from it. Builds on main don't use it and sign with a throwaway key.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    outputs:
      version_name: ${{ steps.tag.outputs.version_name }}
      build_number: ${{ steps.build.outputs.build_number }}
      aab_sha256: ${{ steps.aab.outputs.sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag check below needs main's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The keystore goes to $RUNNER_TEMP, never under an uploaded path. Without the
      # secrets (forks, or before the owner sets them) a throwaway key made here signs
      # the bundle, so the build and the not-debug check still run; nothing is uploaded.
      - name: Write key.properties
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          set_count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS"; do
            if [ -n "$value" ]; then set_count=$((set_count + 1)); fi
          done
          if [ "$set_count" -eq 4 ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="$ANDROID_KEY_PASSWORD"
            alias="$ANDROID_KEY_ALIAS"
            signing=upload
          elif [ "$set_count" -eq 0 ]; then
            echo "::notice::Keystore secrets are not set: signing with a throwaway key, no artifact is uploaded"
            store_password="$(openssl rand -hex 24)"
            echo "::add-mask::$store_password"
            key_password="$store_password"
            alias=throwaway
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -storepass "$store_password" -keypass "$key_password" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Throwaway CI key" -noprompt
            signing=throwaway
          else
            echo "::error::Only $set_count of the 4 keystore secrets are set"
            exit 1
          fi
          # key.properties is a Java properties file: a backslash starts an escape.
          umask 077
          {
            echo "storeFile=${keystore//\\/\\\\}"
            echo "storePassword=${store_password//\\/\\\\}"
            echo "keyPassword=${key_password//\\/\\\\}"
            echo "keyAlias=${alias//\\/\\\\}"
          } > android/key.properties
          # The same key signs the universal APK below; bundletool reads passwords from files.
          printf '%s' "$store_password" > "$RUNNER_TEMP/ks-pass"
          printf '%s' "$key_password" > "$RUNNER_TEMP/key-pass"
          # A file, not a step output: outputs holding a secret are dropped.
          printf '%s' "$alias" > "$RUNNER_TEMP/key-alias"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
      - name: Check the release notes filter
        run: bash ../.github/play-release-notes.test.sh
      - name: Check the promote inputs and track lookup
        run: bash ../.github/play-promote.test.sh
      - name: Check the version tag
        id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          SIGNING: ${{ steps.key.outputs.signing }}
        run: |
          # The tag is the version name: v1.2.3.
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not v1.2.3"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points to a commit that is not on main"
            exit 1
          fi
          if [ "$SIGNING" != upload ]; then
            echo "::error::A release needs the four ANDROID_* keystore secrets"
            exit 1
          fi
          echo "version_name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Build app bundle
        id: build
        env:
          VERSION_NAME: ${{ steps.tag.outputs.version_name }}
        run: |
          build_number=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          args=(--build-number="$build_number")
          if [ -n "$VERSION_NAME" ]; then
            args+=(--build-name="$VERSION_NAME")
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Build number $build_number ${args[*]}"
          flutter build appbundle --release "${args[@]}" | tee "$RUNNER_TEMP/build.log"
          grep -q 'Release signing: upload key from key.properties' "$RUNNER_TEMP/build.log"
      - name: Fail if the bundle carries the Android debug certificate
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/aab-cert.txt"
          if ! grep -q '^Owner:' "$RUNNER_TEMP/aab-cert.txt"; then
            echo "::error::The app bundle is not signed"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/aab-cert.txt"; then
            echo "::error::The app bundle is signed with the Android debug certificate"
            exit 1
          fi
      # Google Play requires 16 KB page support: every APK built from the bundle is
      # zip-aligned for 16 KB pages and every native library has 16 KB LOAD segments.
      - name: Check 16 KB page support of the APKs built from the bundle
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # || true: a missing folder must reach the clear error below, not stop pipefail.
          zipalign="$( (find "$sdk/build-tools" -name zipalign -type f || true) | sort -V | tail -n 1)"
          readelf="$( (find "$sdk/ndk" -path '*/prebuilt/linux-x86_64/bin/llvm-readelf' || true) | sort -V | tail -n 1)"
          if [ -z "$zipalign" ] || [ -z "$readelf" ]; then
            echo "::error::zipalign ($zipalign) or llvm-readelf ($readelf) not found under $sdk"
            exit 1
          fi
          echo "Using $zipalign and $readelf"
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$bundletool" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $bundletool" | sha256sum -c -
          java -jar "$bundletool" build-apks --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/app.apks"
          apks="$RUNNER_TEMP/apks"
          mkdir -p "$apks"
          unzip -q "$RUNNER_TEMP/app.apks" -d "$apks"
          so_count=0
          while IFS= read -r apk; do
            if ! "$zipalign" -c -P 16 -v 4 "$apk" > "$RUNNER_TEMP/zipalign.log"; then
              tail -n 20 "$RUNNER_TEMP/zipalign.log"
              echo "::error::$apk is not aligned for 16 KB pages"
              exit 1
            fi
            echo "zipalign 16 KB OK: ${apk#"$apks"/}"
            libs="$apk.libs"
            mkdir -p "$libs"
            unzip -q -o "$apk" 'lib/*.so' -d "$libs" 2> /dev/null || true
            while IFS= read -r so; do
              so_count=$((so_count + 1))
              aligns="$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')"
              if [ -z "$aligns" ]; then
                echo "::error::No LOAD segment in ${so#"$apks"/}"
                exit 1
              fi
              for align in $aligns; do
                if (( align < 0x4000 )); then
                  echo "::error::${so#"$apks"/} has LOAD alignment $align, below 0x4000"
                  exit 1
                fi
              done
              echo "LOAD alignment OK ($(printf '%s' "$aligns" | tr '\n' ',')): ${so#"$apks"/}"
            done < <(find "$libs" -name '*.so' -type f | sort)
          done < <(find "$apks" -name '*.apk' -type f | sort)
          if [ "$so_count" -eq 0 ]; then
            echo "::error::No native libraries found in the APKs"
            exit 1
          fi
      # The APK Play installs carries the Play package id and is not debug-signed.
      - name: Check package id and signer of the universal APK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools="$( (find "$sdk/build-tools" -name apksigner -type f || true) | sort -V | tail -n 1)"
          tools="${tools%/apksigner}"
          if [ -z "$tools" ] || [ ! -x "$tools/aapt2" ]; then
            echo "::error::apksigner or aapt2 not found under $sdk/build-tools"
            exit 1
          fi
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output="$RUNNER_TEMP/universal.apks" \
            --ks="$RUNNER_TEMP/upload-keystore.jks" --ks-key-alias="$(cat "$RUNNER_TEMP/key-alias")" \
            --ks-pass="file:$RUNNER_TEMP/ks-pass" --key-pass="file:$RUNNER_TEMP/key-pass"
          unzip -q -o "$RUNNER_TEMP/universal.apks" universal.apk -d "$RUNNER_TEMP/universal"
          apk="$RUNNER_TEMP/universal/universal.apk"
          package="$("$tools/aapt2" dump packagename "$apk")"
          echo "Package: $package"
          if [ "$package" != com.linux.simplemathtester ]; then
            echo "::error::Package id is $package, expected com.linux.simplemathtester"
            exit 1
          fi
          "$tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-cert.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apk-cert.txt"; then
            echo "::error::The APK is signed with the Android debug certificate"
            exit 1
          fi
      # Tag only from here on. A push to main stops above and the bundle is discarded
      # with the runner. The digest goes to the upload job as a job output.
      - name: Hash the app bundle
        id: aab
        if: github.ref_type == 'tag'
        run: |
          sha256="$(sha256sum build/app/outputs/bundle/release/app-release.aab | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "App bundle sha256: $sha256"
      - name: Hand the app bundle to the upload job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload to Google Play and create the GitHub release
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Play and DeepSeek keys come from the `release` environment. No Gradle, pub or
    # Flutter runs here: only curl, jq and gh on the bundle the build job signed.
    environment: release
    # Write access creates the GitHub release. The workflow runs only for pushes to
    # this repository (no pull_request trigger), so no outside code gets it.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job's token can write; only the gh steps get it, through GH_TOKEN.
          persist-credentials: false
      - name: Download the app bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-aab
          path: app/build/app/outputs/bundle/release
      - name: Check the app bundle digest
        env:
          AAB_SHA256: ${{ needs.bundle.outputs.aab_sha256 }}
        run: |
          if [ -z "$AAB_SHA256" ]; then
            echo "::error::The build job passed no app bundle digest"
            exit 1
          fi
          echo "$AAB_SHA256  build/app/outputs/bundle/release/app-release.aab" | sha256sum -c -
      # GitHub's automatic notes (merged pull requests since the last tag) go on the
      # GitHub release. Play gets a short summary of them written by DeepSeek, or the
      # automatic notes themselves when there is no DEEPSEEK_API_KEY or the call
      # fails; either way play-release-notes.jq makes them plain, whole lines, 500
      # characters at most. A second call translates a DeepSeek summary into every
      # language of play/listing/; the upload sends the valid ones
      # (play-release-notes-languages.jq). A missing translation never fails a release.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body \
            > "$RUNNER_TEMP/github-notes.md"
          source="$RUNNER_TEMP/github-notes.md"
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            jq -n --arg model "$DEEPSEEK_MODEL" --rawfile notes "$RUNNER_TEMP/github-notes.md" '{
              model: $model, stream: false, temperature: 0.3, max_tokens: 300,
              # Thinking is on by default and spends max_tokens before any answer.
              thinking: {type: "disabled"},
              messages: [
                {role: "system", content: "You write Google Play release notes for Simple Math Tester, a math practice app for children. You get the merged pull requests of a release. Write 2 to 5 short lines in plain English for parents and children, each starting with \"- \", about changes they can see or feel. Leave out tests, CI, build, docs and refactoring. No Markdown, links, names or version numbers. At most 450 characters in total. If nothing is visible to users, write exactly: - Small fixes and improvements."},
                {role: "user", content: $notes}
              ]}' > "$RUNNER_TEMP/ai-request.json"
            if curl -sS --fail-with-body --max-time 60 https://api.deepseek.com/chat/completions \
                -H "Authorization: Bearer $DEEPSEEK_API_KEY" -H 'Content-Type: application/json' \
                --data @"$RUNNER_TEMP/ai-request.json" > "$RUNNER_TEMP/ai-response.json" \
              && jq -er '.choices[0].message.content | select(length > 0)' "$RUNNER_TEMP/ai-response.json" \
                > "$RUNNER_TEMP/ai-notes.txt"; then
              source="$RUNNER_TEMP/ai-notes.txt"
            else
              reason="$(jq -r '.error.message // .choices[0].finish_reason // empty' "$RUNNER_TEMP/ai-response.json" 2>/dev/null || true)"
              echo "::warning::DeepSeek summary failed (${reason:-no response}); Play gets the automatic notes"
            fi
          fi
          jq -nr --rawfile notes "$source" -f ../.github/play-release-notes.jq > "$RUNNER_TEMP/play-notes.txt"
          echo "Play release notes:"
          cat "$RUNNER_TEMP/play-notes.txt"
          # Translations of the summary by Play language code, from a second call so a
          # failed translation never costs the English summary.
          echo '{}' > "$RUNNER_TEMP/ai-answer.json"
          # || true: no translations yet means nothing to translate.
          languages="$(cd ../play/listing && ls -- *.json | sed 's/\.json$//' \
            | { grep -vxE 'en-US|translation_sources' || true; } | paste -sd, -)"
          if [ "$source" = "$RUNNER_TEMP/ai-notes.txt" ] && [ -n "$languages" ]; then
            jq -n --arg model "$DEEPSEEK_MODEL" --arg languages "$languages" \
              --rawfile notes "$RUNNER_TEMP/play-notes.txt" '{
              model: $model, stream: false, temperature: 0.2, max_tokens: 4000,
              thinking: {type: "disabled"},
              response_format: {type: "json_object"},
              messages: [
                {role: "system", content: ("You translate Google Play release notes of Simple Math Tester, a math practice app for children, from English into each of these Google Play languages: " + $languages + ". Keep the same lines, each starting with \"- \", in simple words a child understands. Keep the name Simple Math Tester. Digits are always Western 0-9. At most 450 characters per language. Answer with one JSON object that maps each language code to its notes, nothing else.")},
                {role: "user", content: $notes}
              ]}' > "$RUNNER_TEMP/ai-translate-request.json"
            if curl -sS --fail-with-body --max-time 120 https://api.deepseek.com/chat/completions \
                -H "Authorization: Bearer $DEEPSEEK_API_KEY" -H 'Content-Type: application/json' \
                --data @"$RUNNER_TEMP/ai-translate-request.json" > "$RUNNER_TEMP/ai-translate-response.json" \
              && jq -e '.choices[0].message.content | fromjson | objects' "$RUNNER_TEMP/ai-translate-response.json" \
                > "$RUNNER_TEMP/ai-translations.json"; then
              cp "$RUNNER_TEMP/ai-translations.json" "$RUNNER_TEMP/ai-answer.json"
            else
              reason="$(jq -r '.error.message // .choices[0].finish_reason // empty' "$RUNNER_TEMP/ai-translate-response.json" 2>/dev/null || true)"
              echo "::warning::DeepSeek translation of the notes failed (${reason:-no response}); Play gets English notes only"
            fi
          fi
      # .github/play-token.sh: a short-lived JWT signed by the service account, traded
      # for an access token. play-promote.yml uses it too.
      - name: Get a Play Developer API token
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash ../.github/play-token.sh "$RUNNER_TEMP/play-token"
      - name: Upload to the Play internal testing track
        env:
          VERSION_NAME: ${{ needs.bundle.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bundle.outputs.build_number }}
        run: |
          app=androidpublisher/v3/applications/com.linux.simplemathtester
          api="https://androidpublisher.googleapis.com/$app"
          upload="https://androidpublisher.googleapis.com/upload/$app"
          auth=(-H "Authorization: Bearer $(cat "$RUNNER_TEMP/play-token")")
          edit="$(curl -sS --fail-with-body -X POST "${auth[@]}" "$api/edits" | jq -er .id)"
          code="$(curl -sS --fail-with-body -X POST "${auth[@]}" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @build/app/outputs/bundle/release/app-release.aab \
            "$upload/edits/$edit/bundles?uploadType=media" \
            | jq -er .versionCode)"
          if [ "$code" != "$BUILD_NUMBER" ]; then
            echo "::error::Play reports version code $code, expected $BUILD_NUMBER"
            exit 1
          fi
          notes="$(cat "$RUNNER_TEMP/play-notes.txt")"
          # Notes go only to languages that have a store listing; Play rejects others.
          # A failed lookup sends English alone rather than failing the release.
          listed="$(curl -sS --fail-with-body "${auth[@]}" "$api/edits/$edit/listings" \
            | jq -c '[.listings[]?.language]')" || listed='[]'
          jq -n --arg english "${notes:-Version $VERSION_NAME}" --slurpfile answer "$RUNNER_TEMP/ai-answer.json" \
            --argjson listed "$listed" -f ../.github/play-release-notes-languages.jq > "$RUNNER_TEMP/release-notes.json"
          echo "Release notes languages: $(jq -c 'map(.language)' "$RUNNER_TEMP/release-notes.json")"
          jq -n --arg name "$VERSION_NAME ($code)" --arg code "$code" --slurpfile notes "$RUNNER_TEMP/release-notes.json" \
            '{track: "internal", releases: [{name: $name, versionCodes: [$code], status: "completed",
              releaseNotes: $notes[0]}]}' > "$RUNNER_TEMP/track.json"
          curl -sS --fail-with-body -X PUT "${auth[@]}" -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/track.json" "$api/edits/$edit/tracks/internal" > /dev/null
          curl -sS --fail-with-body -X POST "${auth[@]}" "$api/edits/$edit:commit" > /dev/null
          echo "::notice::Version $VERSION_NAME ($code) is on the Play internal testing track"
      # Last, so a failed build or upload leaves no release behind. Re-run all jobs:
      # that uploads a new build (attempt + 1) with the same version name. Re-running
      # only this job sends the same build again, which Play refuses once it has it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/github-notes.md"
          fi
