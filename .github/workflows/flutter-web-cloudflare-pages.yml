name: Cloudflare Pages (manual compatibility)

on:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
          - test

jobs:
  deploy:
    uses: ./.github/workflows/flutter-checks.yml
    with:
      environment-name: ${{ github.event.inputs.environment-name }}
    secrets: inherit
