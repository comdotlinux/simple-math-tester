name: Cloudflare Pages (manual compatibility)

on:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
          - test

permissions:
  contents: read

jobs:
  deploy:
    # The called workflow's jobs can only narrow these; its deploy job needs deployments: write.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/flutter-checks.yml
    with:
      environment-name: ${{ github.event.inputs.environment-name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
