name: Flutter checks and Cloudflare Pages

on:
  push:
  workflow_dispatch:
    inputs:
      environment-name:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
          - test
  workflow_call:
    inputs:
      environment-name:
        required: false
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  web:
    name: Analyze, test and build web
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  linux-integration:
    name: Launch Linux app and test user journeys
    needs: web
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install Linux integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev xvfb
      - name: Launch app and run integration tests
        run: xvfb-run -a flutter test integration_test -d linux
      - run: flutter build linux --release
      - name: Upload Linux release bundle
        uses: actions/upload-artifact@v7
        with:
          name: simple-math-tester-linux
          path: app/build/linux/x64/release/bundle
          retention-days: 3
          if-no-files-found: error

  android:
    name: Build Android release APK
    needs: linux-integration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Debug signing is retained for build validation, not store distribution.
      - run: flutter build apk --release
      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: simple-math-tester-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error

  ios:
    name: Build unsigned iOS release
    needs: linux-integration
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v7
        with:
          name: simple-math-tester-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: linux-integration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: ${{ github.event.inputs.environment-name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build web --release
        working-directory: app
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/build/web --project-name=simple-math-tester
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
